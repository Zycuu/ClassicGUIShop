name: Build ClassicGUIShop v1.4.0-dev.1
run-name: ClassicGUIShop v1.4.0-dev.1 - ${{ github.event_name }} - ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build universal ClassicGUIShop jar
        shell: bash
        run: |
          set +e
          gradle clean build compatibilityTestJar > build.log 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            grep -n -C 4 -E "error:|FAILURE:|What went wrong|Execution failed" build.log || cat build.log
          else
            tail -n 40 build.log
            test -f build/libs/ClassicGUIShop-v1.4.0-dev.1.jar
          fi
          exit $status

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ClassicGUIShop-build-log
          path: build.log

      - name: Upload ClassicGUIShop
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ClassicGUIShop
          path: |
            build/libs/ClassicGUIShop-v1.4.0-dev.1.jar
            build/libs/ClassicGUIShop-v1.4.0-dev.1-sources.jar

      - name: Upload compatibility test mod
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ClassicGUIShop-compatibility-test
          path: build/libs/ClassicGUIShop-v1.4.0-dev.1-compatibility-test.jar

  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        minecraft:
          - "26.1.1"
          - "26.2"
          - "26.3"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Compile against Minecraft ${{ matrix.minecraft }} without Fabric API dependency
        shell: bash
        env:
          MC_VERSION: ${{ matrix.minecraft }}
        run: |
          set +e
          gradle clean build \
            -Pminecraft_version="$MC_VERSION" \
            > "compatibility-$MC_VERSION.log" 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            grep -n -C 6 -E "error:|FAILURE:|What went wrong|Execution failed" "compatibility-$MC_VERSION.log" \
              || cat "compatibility-$MC_VERSION.log"
          else
            tail -n 40 "compatibility-$MC_VERSION.log"
          fi
          exit $status

      - name: Upload compatibility log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-${{ matrix.minecraft }}
          path: compatibility-${{ matrix.minecraft }}.log

  runtime-smoke-test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        minecraft:
          - "26.1.1"
          - "26.2"
          - "26.3"
        loader: ["0.18.3", "0.19.5"]
        api: [false]
        include:
          - minecraft: "26.3"
            loader: "0.19.5"
            api: true
        exclude:
          - minecraft: "26.3"
            loader: "0.18.3"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Download universal ClassicGUIShop jar
        uses: actions/download-artifact@v4
        with:
          name: ClassicGUIShop
          path: universal

      - name: Download compatibility test mod
        uses: actions/download-artifact@v4
        with:
          name: ClassicGUIShop-compatibility-test
          path: compatibility-test

      - name: Prepare Fabric Loader ${{ matrix.loader }} server with Fabric API=${{ matrix.api }} for Minecraft ${{ matrix.minecraft }}
        shell: bash
        run: |
          python .github/scripts/setup_fabric_server.py \
            "${{ matrix.minecraft }}" \
            server \
            universal/ClassicGUIShop-v1.4.0-dev.1.jar \
            "${{ matrix.loader }}" \
            "${{ matrix.api }}" \
            compatibility-test/ClassicGUIShop-v1.4.0-dev.1-compatibility-test.jar

      - name: Boot universal jar on Loader ${{ matrix.loader }} with Fabric API=${{ matrix.api }}
        shell: bash
        run: |
          chmod +x .github/scripts/boot_fabric_server.sh
          .github/scripts/boot_fabric_server.sh server server.log
          grep -F "Permission model detected" server/server.log
          grep -F "Command integrity verified" server/server.log

      - name: Upload runtime log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.minecraft }}-loader-${{ matrix.loader }}-api-${{ matrix.api }}
          path: server/server.log

  version-switch-test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        newer: ["26.2", "26.3"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Download universal ClassicGUIShop jar
        uses: actions/download-artifact@v4
        with:
          name: ClassicGUIShop
          path: universal

      - name: Download compatibility test mod
        uses: actions/download-artifact@v4
        with:
          name: ClassicGUIShop-compatibility-test
          path: compatibility-test

      - name: Prepare both Fabric Loader 0.19.5 servers without Fabric API
        shell: bash
        run: |
          python .github/scripts/setup_fabric_server.py \
            ${{ matrix.newer }} \
            server-${{ matrix.newer }} \
            universal/ClassicGUIShop-v1.4.0-dev.1.jar \
            0.19.5 \
            false \
            compatibility-test/ClassicGUIShop-v1.4.0-dev.1-compatibility-test.jar
          python .github/scripts/setup_fabric_server.py \
            26.1.1 \
            server-26.1.1 \
            universal/ClassicGUIShop-v1.4.0-dev.1.jar \
            0.19.5 \
            false \
            compatibility-test/ClassicGUIShop-v1.4.0-dev.1-compatibility-test.jar
          chmod +x .github/scripts/boot_fabric_server.sh

      - name: Seed explicit listings and start Minecraft ${{ matrix.newer }}
        shell: bash
        run: |
          python .github/scripts/version_switch_fixture.py seed "${{ matrix.newer }}" server-${{ matrix.newer }}/config/guishop
          .github/scripts/boot_fabric_server.sh server-${{ matrix.newer }} initial-${{ matrix.newer }}.log
          grep -F "Permission model detected" server-${{ matrix.newer }}/initial-${{ matrix.newer }}.log
          grep -F "Command integrity verified" server-${{ matrix.newer }}/initial-${{ matrix.newer }}.log
          test -d server-${{ matrix.newer }}/config/guishop

      - name: Move the ${{ matrix.newer }} configuration to 26.1.1
        shell: bash
        run: |
          mkdir -p server-26.1.1/config
          if [ -d server-26.1.1/config/guishop ]; then
            mv server-26.1.1/config/guishop server-26.1.1/config/guishop-before-switch
          fi
          cp -a server-${{ matrix.newer }}/config/guishop server-26.1.1/config/guishop
          .github/scripts/boot_fabric_server.sh server-26.1.1 downgrade-26.1.1.log
          grep -F "Permission model detected" server-26.1.1/downgrade-26.1.1.log
          grep -F "Command integrity verified" server-26.1.1/downgrade-26.1.1.log

          read -r parked restored <<< "$(
            sed -n 's/.*Runtime listing filter parked \([0-9][0-9]*\), restored \([0-9][0-9]*\).*/\1 \2/p' \
              server-26.1.1/downgrade-26.1.1.log | tail -n 1
          )"
          echo "Downgrade parked $parked listing(s) and restored $restored listing(s)."
          test "${parked:-0}" -gt 0
          test -s server-26.1.1/config/guishop/versioned-listings.json

      - name: Return the same configuration to ${{ matrix.newer }}
        shell: bash
        run: |
          mv server-${{ matrix.newer }}/config/guishop server-${{ matrix.newer }}/config/guishop-before-return
          cp -a server-26.1.1/config/guishop server-${{ matrix.newer }}/config/guishop
          .github/scripts/boot_fabric_server.sh server-${{ matrix.newer }} return-${{ matrix.newer }}.log
          grep -F "Permission model detected" server-${{ matrix.newer }}/return-${{ matrix.newer }}.log
          grep -F "Command integrity verified" server-${{ matrix.newer }}/return-${{ matrix.newer }}.log

          read -r parked restored <<< "$(
            sed -n 's/.*Runtime listing filter parked \([0-9][0-9]*\), restored \([0-9][0-9]*\).*/\1 \2/p' \
              server-${{ matrix.newer }}/return-${{ matrix.newer }}.log | tail -n 1
          )"
          echo "Return parked $parked and restored $restored listing(s)."
          test "${restored:-0}" -gt 0
          python .github/scripts/version_switch_fixture.py verify "${{ matrix.newer }}" server-${{ matrix.newer }}/config/guishop

      - name: Upload version-switch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: version-switch-${{ matrix.newer }}-26.1.1-${{ matrix.newer }}
          path: |
            server-${{ matrix.newer }}/initial-${{ matrix.newer }}.log
            server-26.1.1/downgrade-26.1.1.log
            server-${{ matrix.newer }}/return-${{ matrix.newer }}.log
            server-${{ matrix.newer }}/config/guishop/versioned-listings.json
