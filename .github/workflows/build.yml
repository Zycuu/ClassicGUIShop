name: Build ClassicGUIShop
run-name: ClassicGUIShop 1.4.1 - ${{ github.event_name }} - ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  implementations:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        minecraft: ["26.3", "26.2", "26.1.2", "1.21.11", "1.21.4", "1.21.1", "1.20.6", "1.20.4", "1.20.1"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Build matching implementation and separate tests
        run: gradle --console=plain -PtargetMinecraft=${{ matrix.minecraft }} build remapReleaseTestJar > build.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log-${{ matrix.minecraft }}
          path: build.log
      - uses: actions/upload-artifact@v4
        with:
          name: implementation-${{ matrix.minecraft }}
          path: build/${{ matrix.minecraft }}/libs/*.jar

  package:
    needs: implementations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: implementation-*
          path: implementations
      - name: Assemble one universal installable JAR
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          for directory in Path('implementations').iterdir():
              target = directory.name.removeprefix('implementation-')
              destination = Path('build') / target / 'libs'
              destination.mkdir(parents=True)
              for jar in directory.glob('*.jar'): shutil.copy2(jar, destination / jar.name)
          PY
          python .github/scripts/package_universal.py release/ClassicGUIShop-v1.4.1.jar
          sha256sum release/ClassicGUIShop-v1.4.1.jar > release/ClassicGUIShop-v1.4.1.jar.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ClassicGUIShop-1.4.1
          path: release/*

  runtime:
    needs: package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        minecraft: ["26.3", "26.2", "26.1.2", "1.21.11", "1.21.4", "1.21.1", "1.20.6", "1.20.4", "1.20.1"]
        loader: ["minimum", "0.19.5"]
        include:
          - { minecraft: "26.3", java: "25", remap: false }
          - { minecraft: "26.2", java: "25", remap: false }
          - { minecraft: "26.1.2", java: "25", remap: false }
          - { minecraft: "1.21.11", java: "21", remap: true }
          - { minecraft: "1.21.4", java: "21", remap: true }
          - { minecraft: "1.21.1", java: "21", remap: true }
          - { minecraft: "1.20.6", java: "21", remap: true }
          - { minecraft: "1.20.4", java: "17", remap: true }
          - { minecraft: "1.20.1", java: "17", remap: true }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: ClassicGUIShop-1.4.1
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: implementation-${{ matrix.minecraft }}
          path: tests
      - name: Prepare disposable server using the universal JAR
        env:
          TARGET: ${{ matrix.minecraft }}
          REMAP: ${{ matrix.remap }}
          LOADER: ${{ matrix.loader }}
        run: |
          classifier=release-test-dev
          if [ "$REMAP" = "true" ]; then classifier=release-test; fi
          if [ "$LOADER" = "minimum" ]; then
            LOADER=$(python -c 'import json, os; print(json.load(open("ports/targets.json"))[os.environ["TARGET"]]["loaderMinimum"])')
          fi
          python .github/scripts/setup_fabric_server.py "$TARGET" server release/ClassicGUIShop-v1.4.1.jar "$LOADER" false "tests/ClassicGUIShop-mc$TARGET-v1.4.1-$classifier.jar"
          printf 'server-ip=127.0.0.1\nserver-port=25589\nonline-mode=false\nview-distance=2\nsimulation-distance=2\nlevel-name=release-test-world\n' > server/server.properties
      - name: Test native purchases, sales, variants and live villagers
        run: python .github/scripts/run_release_smoke.py server results/report.json --disposable
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-${{ matrix.minecraft }}-${{ matrix.loader }}
          path: results/*
