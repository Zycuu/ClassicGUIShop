name: Build ClassicGUIShop Alpha
run-name: ClassicGUIShop Alpha - ${{ github.event_name }} - ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  ARTIFACT_BASE: ClassicGUIShop-v1.4.0-alpha.9

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Build release and separate test mod
        shell: bash
        run: |
          set +e
          gradle build compatibilityTestJar -PalphaUiTest=true clientTestClasses > build.log 2>&1
          status=$?
          tail -n 100 build.log
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          test -f "build/libs/$ARTIFACT_BASE.jar"
      - name: Verify release excludes test harnesses
        shell: bash
        run: |
          jar tf "build/libs/$ARTIFACT_BASE.jar" > jar-contents.txt
          if grep -E 'AlphaUiTest|PlayerShopUiTest|AlphaServerChecks|AccountChecks|DetectedContentChecks|CombinedShopChecks|CatalogIntegrityChecks|InventoryOverflowTest|guishop_alpha_test' jar-contents.txt; then
            echo "Test harness entered release JAR" >&2
            exit 1
          fi
          if grep -E 'com/zycu/guishop/(ShopFolderStore|SafeShopFolderLoader|FolderAwareShopGui|CursorStableShopGui|ColoredBlockGroups)' jar-contents.txt; then
            echo "Retired folder implementation entered release JAR" >&2
            exit 1
          fi
          grep -F 'com/zycu/guishop/client/AdminShopClient.class' jar-contents.txt
          grep -F 'META-INF/jars/fabric-networking-api-v1' jar-contents.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ClassicGUIShop-build-log
          path: build.log
      - uses: actions/upload-artifact@v4
        with:
          name: ClassicGUIShop
          path: |
            build/libs/${{ env.ARTIFACT_BASE }}.jar
            build/libs/${{ env.ARTIFACT_BASE }}-sources.jar
      - uses: actions/upload-artifact@v4
        with:
          name: ClassicGUIShop-compatibility-test
          path: build/libs/${{ env.ARTIFACT_BASE }}-compatibility-test.jar

  runtime:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [false, true]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/download-artifact@v4
        with:
          name: ClassicGUIShop
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: ClassicGUIShop-compatibility-test
          path: tests
      - name: Prepare disposable Minecraft 26.3 server
        shell: bash
        run: |
          python .github/scripts/setup_fabric_server.py 26.3 server \
            "release/$ARTIFACT_BASE.jar" 0.19.5 "${{ matrix.api }}" \
            "tests/$ARTIFACT_BASE-compatibility-test.jar"
      - name: Check startup, editor integrity, transactions, and restart
        shell: bash
        run: |
          python .github/scripts/install_detection_fixture.py server --disposable
          mkdir -p server/config/guishop
          printf 'Retired data must remain untouched.\n' > server/config/guishop/folders.json
          cp server/config/guishop/folders.json folders-original.json
          bash .github/scripts/boot_fabric_server.sh server startup.log
          cmp folders-original.json server/config/guishop/folders.json
          grep -F '[ClassicGUIShop Alpha test] PASS:' server/startup.log
          grep -F '[Detected content test] PASS:' server/startup.log
          grep -F '[Account test] PASS:' server/startup.log
          grep -F 'Command integrity verified' server/startup.log
          cp server/config/guishop/shops.json shops-before-restart.json
          cp server/config/guishop/folders.json folders-before-restart.json
          bash .github/scripts/boot_fabric_server.sh server restart.log
          grep -F '[ClassicGUIShop Alpha test] PASS:' server/restart.log
          grep -F '[Detected content test] PASS:' server/restart.log
          grep -F '[Account test] PASS:' server/restart.log
          cmp shops-before-restart.json server/config/guishop/shops.json
          cmp folders-before-restart.json server/config/guishop/folders.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-26.3-api-${{ matrix.api }}
          path: |
            server/startup.log
            server/restart.log
