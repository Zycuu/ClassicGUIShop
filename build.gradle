plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" apply false
    id 'maven-publish'
}

def targetMinecraft = providers.gradleProperty('targetMinecraft').getOrElse(project.minecraft_version)
def targetProfiles = new groovy.json.JsonSlurper().parse(file('ports/targets.json'))
if (!targetProfiles.containsKey(targetMinecraft)) throw new GradleException("Unsupported Minecraft target: $targetMinecraft")
def targetProfile = targetProfiles[targetMinecraft]
apply plugin: targetProfile.remap ? 'net.fabricmc.fabric-loom-remap' : 'net.fabricmc.fabric-loom'
layout.buildDirectory.set(file("build/$targetMinecraft"))

version = "${project.mod_version}+mc${targetMinecraft}"
group = project.maven_group

base { archivesName = "ClassicGUIShop" }

tasks.withType(AbstractArchiveTask).configureEach {
    archiveBaseName.set("ClassicGUIShop")
    archiveVersion.set("v${project.mod_version}")
    archiveAppendix.set("mc${targetMinecraft}")
}

repositories {
    mavenCentral()
}

loom {
    splitEnvironmentSourceSets()
    mods {
        guishop {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

tasks.register('prepareTargetSources', Exec) {
    inputs.dir('src')
    inputs.dir('ports')
    inputs.file('.github/scripts/prepare_target_sources.py')
    inputs.file('.github/scripts/adapt_120_client.py')
    inputs.file('.github/scripts/adapt_nbt.py')
    outputs.dir(layout.buildDirectory.dir('generated'))
    commandLine 'python', '.github/scripts/prepare_target_sources.py', targetMinecraft
}
if (targetMinecraft != '26.3') {
    sourceSets.configureEach { source ->
        if (file("src/${source.name}/java").exists()) source.java.setSrcDirs([layout.buildDirectory.dir("generated/${source.name}")])
    }
    tasks.withType(JavaCompile).configureEach { dependsOn 'prepareTargetSources' }
    tasks.matching { it.name == 'sourcesJar' }.configureEach { dependsOn 'prepareTargetSources' }
}

dependencies {
    minecraft "com.mojang:minecraft:${targetMinecraft}"
    if (targetProfile.remap) mappings loom.officialMojangMappings()
    add(targetProfile.remap ? 'modImplementation' : 'implementation', "net.fabricmc:fabric-loader:${project.loader_version}")
    // Bundle only the APIs the editor needs. Players can still use unmodified clients.
    targetProfile.modules.each { module, moduleVersion ->
        add(targetProfile.remap ? 'modImplementation' : 'implementation', include("net.fabricmc.fabric-api:$module:$moduleVersion"))
    }
    // Optional server integration. Providers bundle/install this API; ordinary clients do not need it.
    if (targetProfile.remap) modCompileOnly "me.lucko:fabric-permissions-api:${targetProfile.permissionsApi}"
    else compileOnly "me.lucko:fabric-permissions-api:${targetProfile.permissionsApi}"
    // Optional integration fixtures are runtime-only and never bundled or published.
    if (project.hasProperty('usefulFoodTestJar')) runtimeOnly files(project.property('usefulFoodTestJar'))
    if (project.hasProperty('fullFabricApiTestJar')) runtimeOnly files(project.property('fullFabricApiTestJar'))
    if (project.hasProperty('travelersBackpackTestJar')) runtimeOnly files(project.property('travelersBackpackTestJar'))
    if (project.hasProperty('forgeConfigTestJar')) runtimeOnly files(project.property('forgeConfigTestJar'))
    if (project.hasProperty('additionalClientTestJars')) runtimeOnly files(project.property('additionalClientTestJars').toString().split(java.io.File.pathSeparator))
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_range", targetMinecraft
    inputs.property "java_version", targetProfile.java
    inputs.property "permissions_api", targetProfile.permissionsApi
    filesMatching("fabric.mod.json") {
        expand(
            "version": project.version,
            "minecraft_range": targetMinecraft,
            "java_version": targetProfile.java,
            "permissions_api": targetProfile.permissionsApi
        )
    }
    // Leads yield two for four string plus slime on the supported 1.20 releases.
    // Keep the economic witness consistent with that native recipe.
    if (targetMinecraft.startsWith('1.20.')) {
        filesMatching('guishop/vanilla-preset-values-26.3.json') {
            filter { line ->
                def data = new groovy.json.JsonSlurper().parseText(line)
                data.tables.each { table ->
                    def limit = (4 * table.inventoryValues['minecraft:string'] + table.inventoryValues['minecraft:slime_ball']) / 2
                    table.inventoryValues['minecraft:lead'] = Math.min(table.inventoryValues['minecraft:lead'] as double, limit as double)
                    table.values['minecraft:lead'] = Math.min(table.values['minecraft:lead'] as double, limit as double)
                }
                groovy.json.JsonOutput.toJson(data)
            }
        }
        filesMatching('guishop/vanilla-economy-26.3.json') {
            filter { line ->
                def data = new groovy.json.JsonSlurper().parseText(line)
                data.rules.findAll { it.kind == 'recipe' && it.name == 'lead' }.each { rule ->
                    rule.inputs = [[choices:['minecraft:string'], count:4], [choices:['minecraft:slime_ball'], count:1]]
                    rule.count = 2
                }
                groovy.json.JsonOutput.toJson(data)
            }
        }
    }
    filesMatching('*.mixins.json') {
        filter { line ->
            def updated = line.replace('JAVA_25', "JAVA_${targetProfile.java}")
            if (targetProfile.remap) updated = updated.replace('"AbstractVillagerMixin",', '"AbstractVillagerMixin"').replace('"VillagerTradeMixin"', '')
            updated
        }
    }
}
processClientResources { filesMatching('*.mixins.json') { filter { it.replace('JAVA_25', "JAVA_${targetProfile.java}") } } }

tasks.withType(JavaCompile).configureEach {
    it.options.release = targetProfile.java as int
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.toVersion(targetProfile.java)
    targetCompatibility = JavaVersion.toVersion(targetProfile.java)
}

// Separate test mod: never included in the player/server release JAR.
sourceSets {
    compatibilityTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    }
    vanillaAudit {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    }
    releaseTest { compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath }
}

dependencies { compatibilityTestCompileOnly 'net.luckperms:api:5.5' }

tasks.register('compatibilityTestJar', Jar) {
    dependsOn tasks.named('compatibilityTestClasses')
    from sourceSets.compatibilityTest.output
    archiveClassifier.set('compatibility-test')
}
tasks.register('vanillaAuditJar', Jar) {
    dependsOn tasks.named('vanillaAuditClasses')
    from sourceSets.vanillaAudit.output
    archiveClassifier.set('vanilla-audit')
}
tasks.register('releaseTestJar', Jar) {
    dependsOn tasks.named('releaseTestClasses')
    from sourceSets.releaseTest.output
    archiveClassifier.set('release-test-dev')
}
if(targetProfile.remap) {
    tasks.register('remapReleaseTestJar', net.fabricmc.loom.task.RemapJarTask) {
        dependsOn tasks.named('releaseTestJar')
        inputFile.set(tasks.named('releaseTestJar').flatMap { it.archiveFile })
        archiveClassifier.set('release-test')
        addNestedDependencies.set(false)
    }
} else tasks.register('remapReleaseTestJar') { dependsOn tasks.named('releaseTestJar') }

// Opt-in desktop integration harness. Neither its classes nor its metadata enter the release JAR.
if (project.hasProperty('alphaUiTest') || project.hasProperty('playerUiTest') || project.hasProperty('beta7UiTest') || project.hasProperty('beta8UiTest') || project.hasProperty('standaloneFontTest')) {
    sourceSets {
        clientTest {
            compileClasspath += sourceSets.client.output + sourceSets.client.compileClasspath
            runtimeClasspath += sourceSets.client.runtimeClasspath
        }
    }
    if(project.hasProperty('standaloneFontTest')) sourceSets.clientTest.java.include('**/StandaloneFontTest.java')
    loom {
        mods {
            guishop_alpha_test { sourceSet sourceSets.clientTest }
        }
        runs {
            client {
                source sourceSets.clientTest
                programArgs '--width', '1320', '--height', '772'
                if(project.hasProperty('standaloneFontTest')) {
                    runDir "../clients/release-font-${targetMinecraft}"
                    vmArg "-Dguishop.fontReport=${project.property('standaloneFontTest')}"
                    if(project.hasProperty("networkSmoke")){programArgs "--username","ReleaseAdmin";vmArg "-Dguishop.networkSmoke=true"}
                }
                if(project.hasProperty('beta8UiTest')) {
                    runDir '../clients/beta8-ui'
                    programArgs '--username','ShopUiBeta8'
                    vmArg '-Dguishop.beta8UiTest=true'
                    vmArg "-Dguishop.beta8UiReport=${file('../../outputs/beta8-ui-review-complete.json').absolutePath}"
                }
                if(project.hasProperty('beta7UiTest')) {
                    runDir '../clients/beta7-ui'
                    programArgs '--username','ShopUiBeta7'
                    vmArg '-Dguishop.beta7UiTest=true'
                    vmArg "-Dguishop.beta7UiReport=${file('../../outputs/beta7-ui-review-complete.json').absolutePath}"
                }
            }
        }
    }
    if (project.hasProperty("betaReviewOnly")) loom.runs.client.vmArg "-Dguishop.betaReviewOnly=true"
    tasks.named('runClient') { dependsOn tasks.named('clientTestClasses') }
    tasks.named('processClientTestResources') {
        def entrypoint = project.hasProperty('standaloneFontTest') ? 'com.zycu.guishop.client.StandaloneFontTest' : project.hasProperty('beta8UiTest') ? 'com.zycu.guishop.client.Beta8UiTest' : project.hasProperty('beta7UiTest') ? 'com.zycu.guishop.client.Beta7UiTest' : project.hasProperty('playerUiTest') ? 'com.zycu.guishop.clienttest.PlayerShopUiTest' : 'com.zycu.guishop.client.AlphaUiTest'
        inputs.property 'test_entrypoint', entrypoint
        filesMatching('fabric.mod.json') {
            expand(test_entrypoint: entrypoint)
        }
    }
    if (project.hasProperty('playerUiTest')) {
        loom.runs.client.vmArg '-Dfabric.debug.disableModIds=guishop'
    }
}
